name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Additive manual trigger so the CI-repair automation can start a fresh run at
  # the fixed-up commit (a GITHUB_TOKEN push does not self-retrigger checks).
  # No inputs; changes no required-check names or existing behavior.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # Repo-wide gates (independent of which tools changed).
      - name: Secret scan (repo-wide)
        run: npm run secret-scan
      - name: Validation infra tests
        run: npx nx test validation
      - name: CI-repair guard unit tests
        run: node --test .github/scripts/ci-repair/*.test.mjs
      - name: Version plan check
        run: npx nx release plan:check || echo "no releasable changes / no plan required"

      # Per-tool gates on changed tools only — a broken tool never fails the others.
      # nx runs a target only on projects that define it, so lint/typecheck are enforced
      # automatically once a tool declares them (no-op until then).
      - name: Affected gates
        run: npx nx affected -t lint typecheck validate test security-check privacy-check policy-check package validate-package

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Exercises generate -> package -> validate-package on every OS, and
      # install/verify-install/uninstall on macOS/Linux (bash steps self-skip on Windows).
      - name: Lifecycle e2e
        run: npx nx test validation

  commitlint:
    # Conventional Commits are validated on the PR range, and also on a
    # workflow_dispatch re-run (used by the CI-repair automation, whose
    # GITHUB_TOKEN push does not re-fire pull_request) so the aggregate check keeps
    # covering commit messages at the re-triggered head. Skipped for Dependabot,
    # whose machine-generated "Bump ..." subjects intentionally use sentence-case and are
    # trusted; enforcing subject-case on them would block every dependency PR.
    if: >-
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # No PR context on a manual/automation re-run: validate the range from
            # the default branch to the dispatched head.
            git fetch origin master:refs/remotes/origin/master
            npx commitlint --from origin/master --to HEAD --verbose
          else
            npx commitlint --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA" --verbose
          fi

  # Single stable required status check. Aggregates every CI job so the branch
  # ruleset never has to reference volatile matrix job names.
  ci-success:
    if: always()
    needs: [verify, cross-platform, commitlint]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required CI jobs failed or were cancelled." >&2
          exit 1
      - name: All required checks passed
        run: echo "CI success."
