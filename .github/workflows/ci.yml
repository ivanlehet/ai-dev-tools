name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # Repo-wide gates (independent of which tools changed).
      - name: Secret scan (repo-wide)
        run: npm run secret-scan
      - name: Validation infra tests
        run: npx nx test validation
      - name: Version plan check
        run: npx nx release plan:check || echo "no releasable changes / no plan required"

      # Per-tool gates on changed tools only — a broken tool never fails the others.
      # nx runs a target only on projects that define it, so lint/typecheck are enforced
      # automatically once a tool declares them (no-op until then).
      - name: Affected gates
        run: npx nx affected -t lint typecheck validate test security-check privacy-check policy-check package validate-package

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Exercises generate -> package -> validate-package on every OS, and
      # install/verify-install/uninstall on macOS/Linux (bash steps self-skip on Windows).
      - name: Lifecycle e2e
        run: npx nx test validation

  commitlint:
    # Conventional Commits are validated on the PR range only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Single stable required status check. Aggregates every CI job so the branch
  # ruleset never has to reference volatile matrix job names.
  ci-success:
    if: always()
    needs: [verify, cross-platform, commitlint]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required CI jobs failed or were cancelled." >&2
          exit 1
      - name: All required checks passed
        run: echo "CI success."
