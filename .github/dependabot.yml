version: 2
updates:
  # Keep the pinned GitHub Actions (by commit SHA) current with security patches.
  # Grouped into a single PR so interdependent actions (e.g. codeql-action/init and
  # codeql-action/analyze) always bump together and stay version-consistent.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  # Root npm workspace (nx, commitlint, and tooling devDependencies).
  # Grouped into a single PR to reduce noise.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
